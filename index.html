<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latinha · latas 3D personalizadas com a sua arte</title>
    <meta name="description" content="Latinhas 3D com a estampa que você escolher: veja a lata girar e trocar de tema na hora." />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="canonical" href="https://latinhas-3d.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Latinha · latas 3D personalizadas" />
    <meta property="og:description" content="Escolha um tema e veja a lata em 3D na hora." />
    <meta property="og:image" content="https://latinhas-3d.vercel.app/img/og.jpg" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/models/can.glb?v=3" as="fetch" type="model/gltf-binary" crossorigin />
  </head>
  <body>
    <header class="site-header" data-header>
      <a class="brand" href="/" aria-label="Latinha, início">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="3" width="18" height="26" rx="5" fill="currentColor"/><rect x="10" y="8" width="12" height="13" rx="2" fill="var(--bg)"/></svg>
        <span>latinha</span>
      </a>
    </header>

    <main id="conteudo">
      <section class="hero" id="topo" aria-labelledby="hero-title" data-hero>
        <div class="hero-bg" aria-hidden="true"></div>

        <div class="can-stage">
          <model-viewer
            class="can"
            data-can
            alt="Lata de alumínio em 3D com a estampa do tema escolhido"
            camera-orbit="0deg 84deg 0.4m"
            min-camera-orbit="auto auto 0.1m"
            max-camera-orbit="auto auto 2m"
            field-of-view="26deg"
            environment-image="neutral"
            tone-mapping="neutral"
            exposure="1.05"
            shadow-intensity="0.9"
            shadow-softness="0.9"
            interaction-prompt="none"
            disable-zoom
            disable-pan
            loading="eager"
            reveal="manual"
          ></model-viewer>
        </div>

        <div class="hero-copy">
          <p class="eyebrow">Latas personalizadas</p>
          <h1 id="hero-title">Sua lata, <br />sua estampa.</h1>
          <p class="hero-lede">Escolha o tema e veja a estampa na lata 3D. Ela é gerada na hora, num canvas.</p>
        </div>

        <div class="picker" role="radiogroup" aria-label="Tema da lata" data-picker></div>
      </section>
    </main>

    <svg class="sr-only" aria-hidden="true" focusable="false">
      <filter id="spin-blur" x="-30%" y="-5%" width="160%" height="110%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="0 0" data-spin-blur />
      </filter>
    </svg>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
